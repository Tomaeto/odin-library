<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Cool Library</title>
</head>

<body>
    <h1 class="header">My Cool Library</h1>


    <dialog id="dialog">
        <form action="" method="post" id="new-book-form">
            <legend>Add New Book</legend>
            <label for="book-title">Title: </label>
            <input type="text" name="booktitle" id="book-title" required>

            <label for="book-author">Author: </label>
            <input type="text" name="bookauthor" id="book-author" required>

            <label for="page-count">Page Count: </label>
            <input type="number" name="bookpagecount" id="page-count" required>

            <div class="checkbox-div">
            <label for="book-read">Has been read</label>
            <input type="checkbox" name="bookread" id="book-read">
            </div>
        </form>
        <button type="submit" form="new-book-form" class="in-dialog-btn">Add Book</button>
        <button command="close" commandfor="dialog" class="in-dialog-btn">Cancel</button>
    </dialog>
    <div class="table-div">
        <button command="show-modal" commandfor="dialog" id="new-book-button">New Book</button>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Page Count</th>
                    <th>Read Status</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
</body>
<script src="script.js"></script>

</html>
