<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Library</title>
</head>

<body>
    <h1>My Library</h1>
    <button command="show-modal" commandfor="dialog">New Book</button>

    <dialog id="dialog">
        <form action="" method="post" id="new-book-form">
            <label for="book-title">Title: </label>
            <input type="text" name="booktitle" id="book-title" required>

            <label for="book-author">Author: </label>
            <input type="text" name="bookauthor" id="book-author" required>

            <label for="page-count">Page Count: </label>
            <input type="number" name="bookpagecount" id="page-count" required>

            <label for="book-read">Read? </label>
            <input type="checkbox" name="bookread" id="book-read">
        </form>
        <button type="submit" form="new-book-form">Add Book</button>
    </dialog>

    <table id="myTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Page Count</th>
                <th>Read Status</th>
                <th></th>
            </tr>
        </thead>
    </table>
</body>
<script src="script.js"></script>

</html>
